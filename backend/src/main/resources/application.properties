spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:constructiondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.h2.console.enabled=false

app.jwt.secret=${JWT_SECRET:construction_mgmt_secret_key_2024_very_long_secure_string}
app.jwt.expiration=86400000

server.port=${PORT:8080}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,https://smart-construction-material-managem.vercel.app}
