spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/construction_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:8008}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:construction_mgmt_secret_key_2024_very_long_secure_string}
app.jwt.expiration=86400000

server.port=${PORT:8080}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

# CORS — allows both local dev and Vercel production
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
