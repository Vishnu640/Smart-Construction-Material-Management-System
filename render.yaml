services:
  - type: web
    name: smart-construction-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        value: construction_mgmt_secret_key_2024_very_long_secure_string
      - key: CORS_ORIGINS
        value: https://smart-construction-material-management-system-2qrcb1rhr.vercel.app
      - key: PORT
        value: 8080
